<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sowmyesh Metikal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0c0c;
    --card: #1a1414;
    --border: #2e2020;
    --pink: #FFC0CB;
    --light-pink: #FFB6C1;
    --gold: #d4a843;
    --gold-light: #f0c060;
    --text: #f0e6d3;
    --muted: #8a7060;
    --green: #27ae60;
    --green-light: #2ecc71;
  }
  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  /* Subtle noise texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .scene {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 3rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 3.5rem 4rem;
    max-width: 480px;
    position: relative;
    box-shadow: 0 0 80px rgba(192, 57, 43, 0.08);
  }

  /* Corner decorations */
  .card::before, .card::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border-color: var(--gold);
    border-style: solid;
  }
  .card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .card::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  .eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.2rem;
  }

  .headline {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    font-weight: 400;
    color: var(--text);
    line-height: 1.25;
    margin-bottom: 0.5rem;
  }

  .headline em {
    font-style: italic;
    color: var(--gold);
  }

  .subline {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 2.5rem;
    line-height: 1.6;
  }

  /* The button */
  .sorry-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: transparent;
    border: 1.5px solid var(--pink);
    color: var(--text);
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-style: italic;
    padding: 14px 40px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: all 0.3s ease;
    outline: none;
    width: 100%;
    overflow: hidden;
  }

  .sorry-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--pink);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s ease;
    z-index: 0;
  }

  .sorry-btn:hover::before { transform: scaleX(1); }
  .sorry-btn:hover { border-color: var(--light-pink); }

  .sorry-btn span { position: relative; z-index: 1; }

  .heart-icon {
    position: relative;
    z-index: 1;
    font-size: 14px;
    animation: heartbeat 2s infinite;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
  }

  /* Pending state */
  .status-row {
    margin-top: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    min-height: 20px;
    transition: opacity 0.3s;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.5s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  /* Count badge */
  .count-badge {
    margin-top: 1rem;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.4s;
  }

  /* Accepted state */
  .accepted .card {
    box-shadow: 0 0 80px rgba(39, 174, 96, 0.12);
    border-color: #1e3a27;
  }

  .accepted .card::before,
  .accepted .card::after {
    border-color: var(--green);
  }

  .accepted .sorry-btn {
    border-color: var(--green);
    cursor: default;
    pointer-events: none;
    background: rgba(39, 174, 96, 0.08);
    color: var(--green-light);
    font-style: normal;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    letter-spacing: 0.04em;
    font-size: 0.95rem;
  }

  .accepted .sorry-btn::before { display: none; }

  .accepted .status-dot {
    background: var(--green-light);
    animation: none;
  }

  .accepted .headline em { color: var(--green-light); }

  /* Confetti */
  .confetti-wrap {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;
  }

  .confetti-piece {
    position: absolute;
    width: 8px; height: 8px;
    opacity: 0;
    animation: fall 1.8s ease-in forwards;
  }

  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* Shake on multiple clicks */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%       { transform: translateX(-6px); }
    40%       { transform: translateX(6px); }
    60%       { transform: translateX(-4px); }
    80%       { transform: translateX(4px); }
  }

  .shake { animation: shake 0.4s ease; }

  /* Accept btn */
  .accept-row {
    margin-top: 1.5rem;
    display: none;
    gap: 10px;
  }

  .accept-row.visible { display: flex; }

  .accept-btn {
    flex: 1;
    padding: 11px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    border: 1px solid;
    background: transparent;
    transition: all 0.2s;
    outline: none;
  }

  .accept-btn.yes {
    border-color: var(--green);
    color: var(--green-light);
  }
  .accept-btn.yes:hover {
    background: rgba(39,174,96,0.1);
  }

  .accept-btn.no {
    border-color: var(--border);
    color: var(--muted);
  }
  .accept-btn.no:hover {
    border-color: var(--pink);
    color: var(--light-pink);
  }

  .accept-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
    text-align: left;
  }
</style>
</head>
<body>
<body>
<div class="scene" id="scene">
  <div class="card" id="card">
    <p class="eyebrow">An apology, sincerely</p>
    <p><a href="tel:+918125483924">+918125483924</a></p>
    <p><a href="tel:+917702279680">+917702279680</a></p>
    <h4 class="headline" id="headline">I am truly <em>sorry</em></h4>
    <p class="subline" id="subline">Press the button to send your apology.<br>It won't go away until it's accepted.</p>

    <button class="sorry-btn" id="sorryBtn" onclick="handleSorry()">
      <span class="smiley-icon">😊</span>
      <span class="archer-icon">🎯</span>
      <span class="8ballpool-icon">🎱</span> </br>
      <span class="bucks-bunny-icon">🐇<span>
      <span class="prince-icon">🙅</span>   
      <span class="heart-icon">💞</span>
      <span class="butterfly-icon">🦋</span></br>
      <span class="crown-icon">👑</span>
      <span class="Queen-icon">💃</span>
      <span class="horse-icon">🎠</span>
      <span class="droplets-icon">💦</span>
      <span class="diamond-icon">💎</span></br>
      <span class="crown-icon">👑</span> 
      <span class="Queens-icon">👯‍♀️</span>
      <span class="carrot-icon">🥕</span> 
      <span class="diamond-icon">💎</span>
      <span class="aeroplane-icon">✈️</span>
      <span class="thumbs-icon">👍</span><br/>
      <span id="btnText">Prince invitation</span>
    </button>
    <div class="accept-row" id="acceptRow">
      <div style="flex:1;">
        <p class="accept-label">Do you accept?</p>
        <div style="display:flex;gap:8px;">
          <button class="accept-btn yes" onclick="accept()">Yes, I accept ✓</button>
          <button class="accept-btn no" onclick="notYet()">Not yet</button>
        </div>
      </div>
    </div>

    <div class="status-row" id="statusRow">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Waiting to be sent…</span>
    </div>

    <p class="count-badge" id="countBadge"></p>
  </div>
</div>

<div class="confetti-wrap" id="confettiWrap"></div>

<script>
  let clicks = 0;
  let accepted = false;
  let prompted = false;

  const btn      = document.getElementById('sorryBtn');
  const btnText  = document.getElementById('btnText');
  const statusText = document.getElementById('statusText');
  const statusDot  = document.getElementById('statusDot');
  const acceptRow  = document.getElementById('acceptRow');
  const countBadge = document.getElementById('countBadge');
  const scene      = document.getElementById('scene');
  const headline   = document.getElementById('headline');
  const subline    = document.getElementById('subline');
  const card       = document.getElementById('card');

  const messages = [
    "The only way to do great work is to love what you do.— Steve Jobs",
    "In the middle of every difficulty lies opportunity.— Albert Einstein",
    "It is during our darkest moments that we must focus to see the light.— Aristotle",
    "Life is what happens when you're busy making other plans.— John Lennon",
    "The future belongs to those who believe in the beauty of their dreams.— Eleanor Roosevelt",
    "Spread love everywhere you go. Let no one ever come to you without leaving happier.— Mother Teresa",
    "When you reach the end of your rope, tie a knot in it and hang on.— Franklin D. Roosevelt",
    "Always remember that you are absolutely unique. Just like everyone else.— Margaret Mead",
    "Don't judge each day by the harvest you reap but by the seeds that you plant.— Robert Louis Stevenson",
    "The best time to plant a tree was 20 years ago. The second best time is now.— Chinese Proverb",
    "An unexamined life is not worth living.— Socrates",
    "Be yourself; everyone else is already taken.— Oscar Wilde",
    "You only live once, but if you do it right, once is enough.— Mae West",
    "Be the change you wish to see in the world.— Mahatma Gandhi",
    "In three words I can sum up everything I've learned about life: it goes on.— Robert Frost",
    "If you tell the truth, you don't have to remember anything.— Mark Twain",
    "A friend is someone who knows all about you and still loves you.— Elbert Hubbard",
    "Without music, life would be a mistake.— Friedrich Nietzsche",
    "We accept the love we think we deserve.— Stephen Chbosky",
    "It does not matter how slowly you go as long as you do not stop.— Confucius",
    "Everything you've ever wanted is on the other side of fear.— George Addair",
    "Success is not final, failure is not fatal: it is the courage to continue that counts.— Winston Churchill",
    "Hardships often prepare ordinary people for an extraordinary destiny.— C.S. Lewis",
    "Believe you can and you're halfway there.— Theodore Roosevelt",
    "To handle yourself, use your head; to handle others, use your heart.— Eleanor Roosevelt",
    "Too many of us are not living our dreams because we are living our fears.— Les Brown",
    "I have learned over the years that when one's mind is made up, this diminishes fear.— Rosa Parks",
    "Nothing is impossible, the word itself says 'I'm possible'!— Audrey Hepburn",
    "The question isn't who is going to let me; it's who is going to stop me.— Ayn Rand",
    "It always seems impossible until it's done.— Nelson Mandela",
    "Don't watch the clock; do what it does. Keep going.— Sam Levenson",
    "Keep your face always toward the sunshine—and shadows will fall behind you.— Walt Whitman",
    "Whether you think you can or you think you can't, you're right.— Henry Ford",
    "The mind is everything. What you think you become.— Buddha",
    "I attribute my success to this: I never gave or took any excuse.— Florence Nightingale",
    "You miss 100% of the shots you don't take.— Wayne Gretzky",
    "The most difficult thing is the decision to act, the rest is merely tenacity.— Amelia Earhart",
    "Definiteness of purpose is the starting point of all achievement.— W. Clement Stone",
    "By failing to prepare, you are preparing to fail.— Benjamin Franklin",
    "Life isn't about finding yourself. Life is about creating yourself.— George Bernard Shaw",
    "The most common way people give up their power is by thinking they don't have any.— Alice Walker",
    "The mind is not a vessel to be filled but a fire to be ignited.— Plutarch",
    "You become what you believe.— Oprah Winfrey",
    "Not everything that is faced can be changed, but nothing can be changed until it is faced.— James Baldwin",
    "I can't change the direction of the wind, but I can adjust my sails.— Jimmy Dean",
    "Everyone thinks of changing the world, but no one thinks of changing himself.— Leo Tolstoy",
    "If not us, who? If not now, when?— John F. Kennedy",
    "The only impossible journey is the one you never begin.— Tony Robbins",
    "In the end, it's not the years in your life that count. It's the life in your years.— Abraham Lincoln",
    "Never let the fear of striking out keep you from playing the game.— Babe Ruth",
    "Money and success don't change people; they merely amplify what is already there.— Will Smith",
    "Not how long, but how well you have lived is the main thing.— Seneca",
    "I'm Sorry",
    "I really mean it…",
    "Please forgive me?",
    "I am so sorry ♥",
    "I was wrong. I'm sorry.",
    "Still sorry. Always will be.",
    "From the bottom of my heart…",
    "I'll keep saying it until you accept.",
  ];

  const statuses = [
    "Apology sent. Awaiting acceptance…",
    "Still waiting…",
    "Genuinely sorry. Still here.",
    "Won't stop until you say yes.",
    "Knock knock… it's your apology again.",
    "This apology has no expiry date.",
    "Patience level: infinite.",
  ];

  function handleSorry() {
    if (accepted) return;
    clicks++;

    const msgIdx = Math.min(clicks - 1, messages.length - 1);
    const statIdx = Math.min(clicks - 1, statuses.length - 1);

    btnText.textContent = messages[msgIdx];
    statusText.textContent = statuses[statIdx];
    statusDot.style.background = '#d4a843';
    statusDot.style.animation = 'blink 1s infinite';

    if (clicks >= 3 && !prompted) {
      prompted = true;
      acceptRow.classList.add('visible');
      subline.textContent = 'Do you accept this apology?';
    }

    if (clicks > 1) {
      countBadge.style.opacity = '1';
      countBadge.textContent = `Apologised ${clicks} time${clicks > 1 ? 's' : ''}`;
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }
  }

  function accept() {
    accepted = true;
    scene.classList.add('accepted');
    acceptRow.classList.remove('visible');
    btnText.textContent = 'Apology Accepted ✓';
    headline.innerHTML = 'All is <em>memorable dreamz</em>';
    subline.textContent = 'Thank you for accepting. That means everything.';
    statusText.textContent = 'Accepted with grace.';
    statusDot.style.background = 'var(--green-light)';
    statusDot.style.animation = 'none';
    countBadge.style.opacity = '0';
    launchConfetti();
  }

  function notYet() {
    acceptRow.classList.remove('visible');
    prompted = false;
    subline.textContent = 'Okay. Keep pressing. This apology isn\'t going anywhere.';
    statusText.textContent = 'Not yet accepted. Keep trying…';
    statusDot.style.background = 'var(--pink)';
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
  }

  function launchConfetti() {
    const wrap = document.getElementById('confettiWrap');
    const colors = ['#d4a843','#27ae60','#c0392b','#f0e6d3','#2ecc71','#f0c060'];
    for (let i = 0; i < 60; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.top = '-10px';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      el.style.width = (6 + Math.random() * 8) + 'px';
      el.style.height = (6 + Math.random() * 8) + 'px';
      el.style.animationDelay = (Math.random() * 0.8) + 's';
      el.style.animationDuration = (1.2 + Math.random() * 1) + 's';
      wrap.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }
  }

  card.addEventListener('animationend', () => card.classList.remove('shake'));
</script>
</body>
</html>
